<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111827" />
  <title>골친자들 골치아픔 ⛳</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f3f4f6;
      color: #111827;
      padding-bottom: 85px;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 24px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 13px;
      color: #d1d5db;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 14px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat {
      background: #f9fafb;
      padding: 13px 8px;
      border-radius: 12px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 20px;
      margin-bottom: 4px;
    }

    .stat span {
      font-size: 12px;
      color: #6b7280;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      margin-bottom: 10px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #111827;
      color: white;
    }

    .green {
      background: #16a34a;
      color: white;
    }

    .red {
      background: #dc2626;
      color: white;
    }

    .list-item {
      border-bottom: 1px solid #e5e7eb;
      padding: 13px 0;
    }

    .list-item:last-child {
      border-bottom: 0;
    }

    .small {
      font-size: 12px;
      color: #6b7280;
      margin-top: 4px;
    }

    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px solid #eee;
    }

    .rank-num {
      font-weight: bold;
      margin-right: 10px;
    }

    .member-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 9px;
    }

    .member {
      padding: 12px;
      border-radius: 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    .team {
      background: #f9fafb;
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 10px;
    }

    .team h3 {
      margin-bottom: 7px;
      font-size: 15px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: white;
      border-top: 1px solid #d1d5db;
      display: flex;
      z-index: 999;
    }

    nav button {
      flex: 1;
      background: white;
      color: #6b7280;
      border-radius: 0;
      padding: 6px;
      font-size: 11px;
    }

    nav button.active {
      color: #16a34a;
      font-weight: bold;
    }

    .nav-icon {
      display: block;
      font-size: 21px;
      margin-bottom: 2px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .badge {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
    }

    .money-plus {
      color: #16a34a;
      font-weight: bold;
    }

    .money-minus {
      color: #dc2626;
      font-weight: bold;
    }

    .delete-btn {
      width: auto;
      background: #fee2e2;
      color: #991b1b;
      padding: 7px 10px;
      font-size: 12px;
      margin-top: 8px;
    }

    @media (max-width: 450px) {
      header h1 {
        font-size: 21px;
      }

      .container {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>골친자들 골치아픔 ⛳</h1>
  <p>15명 전용 골프모임 · 시즌 2026</p>
</header>

<div class="container">

  <!-- 홈 -->
  <section id="home" class="page active">

    <div class="card">
      <h2>🏆 시즌 현황</h2>

      <div class="stats">
        <div class="stat">
          <strong id="memberCount">15</strong>
          <span>멤버</span>
        </div>

        <div class="stat">
          <strong id="roundCount">0</strong>
          <span>라운딩</span>
        </div>

        <div class="stat">
          <strong id="scoreCount">0</strong>
          <span>스코어 기록</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>🥇 시즌 랭킹</h2>
      <div id="ranking"></div>
    </div>

    <div class="card">
      <h2>⛳ 다음 라운딩</h2>
      <div id="nextRound">
        아직 등록된 라운딩이 없습니다.
      </div>
    </div>

  </section>


  <!-- 라운딩 -->
  <section id="round" class="page">

    <div class="card">
      <h2>📅 라운딩 등록</h2>

      <input id="roundDate" type="date">

      <input id="roundTime" type="time">

      <input
        id="roundCourse"
        type="text"
        placeholder="골프장 이름"
      >

      <textarea
        id="roundMemo"
        placeholder="메모 / 회비 / 집결시간 등"
      ></textarea>

      <button
        class="green"
        onclick="addRound()"
      >
        라운딩 저장
      </button>
    </div>


    <div class="card">
      <h2>🎲 랜덤 조편성</h2>

      <button
        class="primary"
        onclick="makeTeams()"
      >
        15명 랜덤 조편성
      </button>

      <div
        id="teamResult"
        style="margin-top:15px"
      ></div>
    </div>


    <div class="card">
      <h2>📋 라운딩 목록</h2>
      <div id="roundList"></div>
    </div>

  </section>


  <!-- 스코어 -->
  <section id="score" class="page">

    <div class="card">
      <h2>✍️ 스코어 입력</h2>

      <select id="scoreMember"></select>

      <input
        id="scoreDate"
        type="date"
      >

      <input
        id="scoreCourse"
        type="text"
        placeholder="골프장"
      >

      <input
        id="scoreValue"
        type="number"
        min="55"
        max="180"
        placeholder="타수"
      >

      <input
        id="birdies"
        type="number"
        min="0"
        value="0"
        placeholder="버디 개수"
      >

      <select id="near">
        <option value="0">
          니어리스트 없음
        </option>

        <option value="1">
          니어리스트 🏆
        </option>
      </select>

      <select id="longest">
        <option value="0">
          롱기스트 없음
        </option>

        <option value="1">
          롱기스트 💣
        </option>
      </select>

      <button
        class="green"
        onclick="addScore()"
      >
        기록 저장
      </button>
    </div>


    <div class="card">
      <h2>📊 스코어 기록</h2>
      <div id="scoreList"></div>
    </div>

  </section>


  <!-- 멤버 -->
  <section id="member" class="page">

    <div class="card">
      <h2>👥 멤버 15명</h2>

      <div
        id="memberGrid"
        class="member-grid"
      ></div>
    </div>

  </section>


  <!-- 회비 -->
  <section id="money" class="page">

    <div class="card">
      <h2>💰 회비 · 벌금 · 찬조</h2>

      <select id="moneyMember"></select>

      <select id="moneyType">
        <option value="회비">회비</option>
        <option value="벌금">벌금</option>
        <option value="찬조">찬조</option>
      </select>

      <input
        id="moneyAmount"
        type="number"
        placeholder="금액"
      >

      <input
        id="moneyMemo"
        type="text"
        placeholder="메모 예) 지각 벌금"
      >

      <button
        class="green"
        onclick="addMoney()"
      >
        정산 저장
      </button>
    </div>


    <div class="card">
      <h2>💵 총 정산</h2>

      <div
        id="moneySummary"
        style="font-size:22px;font-weight:bold"
      >
        0원
      </div>
    </div>


    <div class="card">
      <h2>🧾 정산 내역</h2>

      <div id="moneyList"></div>
    </div>

  </section>

</div>


<nav>

  <button
    class="active"
    onclick="showPage('home',this)"
  >
    <span class="nav-icon">🏠</span>
    홈
  </button>

  <button
    onclick="showPage('round',this)"
  >
    <span class="nav-icon">⛳</span>
    라운딩
  </button>

  <button
    onclick="showPage('score',this)"
  >
    <span class="nav-icon">📊</span>
    스코어
  </button>

  <button
    onclick="showPage('member',this)"
  >
    <span class="nav-icon">👥</span>
    멤버
  </button>

  <button
    onclick="showPage('money',this)"
  >
    <span class="nav-icon">💰</span>
    회비
  </button>

</nav>


<script>

const defaultMembers = [
  "재준",
  "멤버2",
  "멤버3",
  "멤버4",
  "멤버5",
  "멤버6",
  "멤버7",
  "멤버8",
  "멤버9",
  "멤버10",
  "멤버11",
  "멤버12",
  "멤버13",
  "멤버14",
  "멤버15"
];


let members =
JSON.parse(localStorage.getItem("members"))
|| defaultMembers;


let rounds =
JSON.parse(localStorage.getItem("rounds"))
|| [];


let scores =
JSON.parse(localStorage.getItem("scores"))
|| [];


let money =
JSON.parse(localStorage.getItem("money"))
|| [];


function saveData() {

  localStorage.setItem(
    "members",
    JSON.stringify(members)
  );

  localStorage.setItem(
    "rounds",
    JSON.stringify(rounds)
  );

  localStorage.setItem(
    "scores",
    JSON.stringify(scores)
  );

  localStorage.setItem(
    "money",
    JSON.stringify(money)
  );

}


function showPage(id, btn) {

  document
    .querySelectorAll(".page")
    .forEach(page =>
      page.classList.remove("active")
    );


  document
    .querySelectorAll("nav button")
    .forEach(button =>
      button.classList.remove("active")
    );


  document
    .getElementById(id)
    .classList.add("active");


  btn.classList.add("active");


  renderAll();
}


function renderMembers() {

  const grid =
    document.getElementById("memberGrid");


  grid.innerHTML = "";


  members.forEach((member,index)=>{

    const div =
      document.createElement("div");


    div.className = "member";


    div.innerHTML = `
      <strong>
        ${index + 1}. ${member}
      </strong>

      <button
        class="delete-btn"
        onclick="editMember(${index})"
      >
        이름 수정
      </button>
    `;


    grid.appendChild(div);

  });


  const scoreSelect =
    document.getElementById("scoreMember");


  const moneySelect =
    document.getElementById("moneyMember");


  scoreSelect.innerHTML = "";
  moneySelect.innerHTML = "";


  members.forEach(member=>{

    scoreSelect.innerHTML +=
      `<option value="${member}">
        ${member}
      </option>`;


    moneySelect.innerHTML +=
      `<option value="${member}">
        ${member}
      </option>`;

  });

}


function editMember(index) {

  const name =
    prompt(
      "멤버 이름을 입력하세요",
      members[index]
    );


  if(!name) return;


  members[index] = name;


  saveData();
  renderAll();

}


function addRound() {

  const date =
    document.getElementById("roundDate").value;


  const time =
    document.getElementById("roundTime").value;


  const course =
    document.getElementById("roundCourse").value;


  const memo =
    document.getElementById("roundMemo").value;


  if(!date || !course) {

    alert(
      "날짜와 골프장을 입력해줘!"
    );

    return;

  }


  rounds.push({
    date,
    time,
    course,
    memo
  });


  rounds.sort(
    (a,b)=>
      new Date(a.date) -
      new Date(b.date)
  );


  saveData();


  document.getElementById("roundCourse").value = "";
  document.getElementById("roundMemo").value = "";


  renderAll();

}


function deleteRound(index) {

  if(!confirm("라운딩 삭제할까?"))
    return;


  rounds.splice(index,1);


  saveData();
  renderAll();

}


function renderRounds() {

  const list =
    document.getElementById("roundList");


  if(rounds.length === 0) {

    list.innerHTML =
      "아직 라운딩이 없습니다.";

    return;

  }


  list.innerHTML = "";


  rounds.forEach((round,index)=>{

    list.innerHTML += `

      <div class="list-item">

        <strong>
          ⛳ ${round.course}
        </strong>

        <div class="small">
          ${round.date}
          ${round.time || ""}
        </div>

        <div class="small">
          ${round.memo || ""}
        </div>

        <button
          class="delete-btn"
          onclick="deleteRound(${index})"
        >
          삭제
        </button>

      </div>

    `;

  });

}


function makeTeams() {

  const shuffled =
    [...members]
      .sort(()=>Math.random() - .5);


  const teams = [
    [],
    [],
    [],
    []
  ];


  shuffled.forEach(
    (member,index)=>{

      teams[
        index % 4
      ].push(member);

    }
  );


  const result =
    document.getElementById(
      "teamResult"
    );


  result.innerHTML = "";


  teams.forEach((team,index)=>{

    result.innerHTML += `

      <div class="team">

        <h3>
          ${index + 1}조
        </h3>

        ${team.join(" · ")}

      </div>

    `;

  });

}


function addScore() {

  const member =
    document.getElementById(
      "scoreMember"
    ).value;


  const date =
    document.getElementById(
      "scoreDate"
    ).value;


  const course =
    document.getElementById(
      "scoreCourse"
    ).value;


  const score =
    Number(
      document.getElementById(
        "scoreValue"
      ).value
    );


  const birdies =
    Number(
      document.getElementById(
        "birdies"
      ).value
    );


  const near =
    Number(
      document.getElementById(
        "near"
      ).value
    );


  const longest =
    Number(
      document.getElementById(
        "longest"
      ).value
    );


  if(
    !date ||
    !course ||
    !score
  ) {

    alert(
      "날짜, 골프장, 타수를 입력해줘!"
    );

    return;

  }


  scores.push({
    member,
    date,
    course,
    score,
    birdies,
    near,
    longest
  });


  saveData();


  document.getElementById(
    "scoreCourse"
  ).value = "";


  document.getElementById(
    "scoreValue"
  ).value = "";


  document.getElementById(
    "birdies"
  ).value = 0;


  renderAll();

}


function deleteScore(index) {

  if(
    !confirm(
      "스코어 기록 삭제할까?"
    )
  ) return;


  scores.splice(index,1);


  saveData();
  renderAll();

}


function renderScores() {

  const list =
    document.getElementById(
      "scoreList"
    );


  if(scores.length === 0) {

    list.innerHTML =
      "아직 기록이 없습니다.";

    return;

  }


  list.innerHTML = "";


  [...scores]
    .reverse()
    .forEach(
      (score,reverseIndex)=>{

        const realIndex =
          scores.length -
          1 -
          reverseIndex;


        list.innerHTML += `

          <div class="list-item">

            <strong>
              ${score.member}
              ·
              ${score.score}타
            </strong>

            <div class="small">
              ${score.date}
              ·
              ${score.course}
            </div>

            <div class="small">

              🐦 버디
              ${score.birdies}

              &nbsp;

              ${
                score.near
                ? "🎯 니어"
                : ""
              }

              &nbsp;

              ${
                score.longest
                ? "💣 롱기"
                : ""
              }

            </div>

            <button
              class="delete-btn"
              onclick="deleteScore(${realIndex})"
            >
              삭제
            </button>

          </div>

        `;

      }
    );

}


function renderRanking() {

  const ranking =
    document.getElementById(
      "ranking"
    );


  const data = [];


  members.forEach(member=>{

    const memberScores =
      scores
        .filter(
          score =>
            score.member === member
        )
        .map(
          score => score.score
        );


    if(
      memberScores.length > 0
    ) {

      const avg =
        memberScores.reduce(
          (a,b)=>a+b,
          0
        )
        /
        memberScores.length;


      const best =
        Math.min(
          ...memberScores
        );


      data.push({
        member,
        avg,
        best
      });

    }

  });


  data.sort(
    (a,b)=>a.avg - b.avg
  );


  if(
    data.length === 0
  ) {

    ranking.innerHTML =
      "스코어가 입력되면 랭킹이 표시됩니다.";

    return;

  }


  ranking.innerHTML = "";


  data.forEach(
    (item,index)=>{

      ranking.innerHTML += `

        <div class="rank-item">

          <div>

            <span class="rank-num">
              ${index + 1}위
            </span>

            ${item.member}

          </div>

          <div>

            평균
            ${item.avg.toFixed(1)}

            <div class="small">

              라베
              ${item.best}

            </div>

          </div>

        </div>

      `;

    }
  );

}


function addMoney() {

  const member =
    document.getElementById(
      "moneyMember"
    ).value;


  const type =
    document.getElementById(
      "moneyType"
    ).value;


  const amount =
    Number(
      document.getElementById(
        "moneyAmount"
      ).value
    );


  const memo =
    document.getElementById(
      "moneyMemo"
    ).value;


  if(!amount) {

    alert(
      "금액을 입력해줘!"
    );

    return;

  }


  money.push({
    member,
    type,
    amount,
    memo,
    date:
      new Date()
        .toLocaleDateString()
  });


  saveData();


  document.getElementById(
    "moneyAmount"
  ).value = "";


  document.getElementById(
    "moneyMemo"
  ).value = "";


  renderAll();

}


function deleteMoney(index) {

  if(
    !confirm(
      "정산 내역 삭제할까?"
    )
  ) return;


  money.splice(index,1);


  saveData();
  renderAll();

}


function renderMoney() {

  const list =
    document.getElementById(
      "moneyList"
    );


  const summary =
    document.getElementById(
      "moneySummary"
    );


  const total =
    money.reduce(
      (sum,item)=>
        sum +
        item.amount,
      0
    );


  summary.innerText =
    total.toLocaleString()
    + "원";


  if(
    money.length === 0
  ) {

    list.innerHTML =
      "아직 정산 내역이 없습니다.";

    return;

  }


  list.innerHTML = "";


  [...money]
    .reverse()
    .forEach(
      (item,reverseIndex)=>{

        const realIndex =
          money.length -
          1 -
          reverseIndex;


        list.innerHTML += `

          <div class="list-item">

            <strong>
              ${item.member}
            </strong>

            <span class="badge">
              ${item.type}
            </span>

            <div class="money-plus">

              +
              ${item.amount.toLocaleString()}
              원

            </div>

            <div class="small">
              ${item.memo || ""}
            </div>

            <button
              class="delete-btn"
              onclick="deleteMoney(${realIndex})"
            >
              삭제
            </button>

          </div>

        `;

      }
    );

}


function renderNextRound() {

  const box =
    document.getElementById(
      "nextRound"
    );


  const today =
    new Date();


  today.setHours(
    0,0,0,0
  );


  const upcoming =
    rounds
      .filter(
        round =>
          new Date(
            round.date
          ) >= today
      )
      .sort(
        (a,b)=>
          new Date(a.date)
          -
          new Date(b.date)
      );


  if(
    upcoming.length === 0
  ) {

    box.innerHTML =
      "예정된 라운딩이 없습니다.";

    return;

  }


  const round =
    upcoming[0];


  box.innerHTML = `

    <strong style="font-size:18px">

      ⛳ ${round.course}

    </strong>

    <div class="small">

      ${round.date}

      ${round.time || ""}

    </div>

    <div style="margin-top:8px">

      ${round.memo || ""}

    </div>

  `;

}


function renderStats() {

  document.getElementById(
    "memberCount"
  ).innerText =
    members.length;


  document.getElementById(
    "roundCount"
  ).innerText =
    rounds.length;


  document.getElementById(
    "scoreCount"
  ).innerText =
    scores.length;

}


function renderAll() {

  renderMembers();

  renderRounds();

  renderScores();

  renderRanking();

  renderMoney();

  renderNextRound();

  renderStats();

}


renderAll();

</script>

</body>
</html>
